dockerPullSecret:
  create: false

  # In case you want to create your own docker pull secret, enter its name here
  name: ""

  # Docker's config json encoded in base64.
  # This value is a must in order to pull the image from the private repository.
  # This value can be retrieved from the tenant.
  # In case you want to set the value from here, set `create` to true
  value: ""

deploymentSecret:
  # Set to "false" to inject distributionId externally, e.g. Vault-agent-injector
  create: true

  # In case you want to create your own deployment secret, enter its name here
  name: ""

serviceAccount:
  # create/don't create service account
  create: true

  # Name of the service account
  name: "xdr-agent-user"

  openshift:
    # SecurityConstraintContext are general constraints for our service account user
    # and are necessary for openshift
    scc:
      create: false

platform:
  # Deploy on TalOS platform
  talos: false
  # Deploy on GCOS platform
  gcos: false
  # Deploy on bottlerocket platform
  bottlerocket: false
  # Deploy on autopilot cluster
  autopilot: false
  # Deploy on Flatcar (immutable rootfs; /lib/modules is read-only).
  # Enable together with agent.agentFlavor: 3.
  flatcar: false

rbac:
  # create/don't create Cluster Role and Cluster Role Bindings
  create: true

agent:
  # Agent distribution id should be retrieved from the tenant
  distributionId: ""

  # The default distribution server comes with the image but it can be changed
  # through here (for development) if needed
  distributionServer: ""

  # Proxies for the agent to use, for example: 10.10.10.1:8080,10.10.10.2:8080
  proxyList: ""

  # Tags describing the endpoint, for example: "main,dev-machine1,test 123"
  endpointTags: ""

  # Name of the kuberenetes cluster - optional
  clusterName: ""

  # Agent flavor selects the feature-set for the deployment:
  #   1 = standard (default, full agent)
  #   3 = cloud/sensor mode (lightweight, selects the sensor resource profile)
  agentFlavor: 1

daemonset:
  # node labels to match pods with
  nodeSelector:
    kubernetes.io/os: linux

  podAnnotations:
    container.apparmor.security.beta.kubernetes.io/cortex-agent: unconfined

  affinity: {}

  priorityClassName: ""

  # Makes pods runnable on all nodes including master node.
  tolerations:
  - operator: Exists
    effect: NoSchedule
  - operator: Exists
    effect: PreferNoSchedule
  - operator: Exists
    effect: NoExecute

  # Default strategy to update the daemonset
  updateStrategy: RollingUpdate

  # Time for which k8s waits for the agent's pod to terminate gracefully.
  terminationGracePeriodSeconds: 90

  image:
    # image repository url, can be retrieved from the tenant
    repository: ""

    # Only pull image if it doesn't exist in cache
    pullPolicy: IfNotPresent

    tag: "latest"

    # for autopilot
    url: ""

  # Resource profiles for the cortex agent container.
  # The profile used at runtime is selected by `agent.agentFlavor`:
  #   agentFlavor: 1 -> resources.full   (default, full agent)
  #   agentFlavor: 3 -> resources.sensor (lightweight cloud-native)
  # These values are the recommended values for cortex agent
  # and are not recommended to change!
  resources:
    full:
      limits:
        memory: "2Gi"
        ephemeral-storage: "10Gi"
      requests:
        cpu: "200m"
        memory: "600Mi"
        ephemeral-storage: "5Gi"
    sensor:
      limits:
        cpu: "1000m"
        memory: "350Mi"
        ephemeral-storage: "10Gi"
      requests:
        cpu: "200m"
        memory: "256Mi"
        ephemeral-storage: "5Gi"
  selinuxOptionsSpcT: false

namespace:
  create: true
  name: "cortex-xdr"

# Optional: copy TSFs (crash, memory, CPU, manual; at most one per type) to
# customer-provisioned persistent storage, so they survive node replacement.
tsfPersistentStorage:
  enabled: false
  # Name of an existing PVC in namespace.name (customer-created, ReadWriteMany).
  # Mounted only if it is Bound and RWX at install/upgrade time; otherwise the feature is skipped with a WARNING.
  # Always skipped by helm template / GitOps renders (no cluster to look up).
  pvcName: ""
  # Sub-directory inside the volume, relative and without "..", e.g. "cortex/prod-cluster-1".
  # Each node writes only to <path>/<node-name>.
  path: ""
  # Collect a TSF when agent memory stays at or above `percent` of its limit for `seconds`.
  # Requires tsfPersistentStorage.enabled=true.
  memoryTsfTrigger:
    enabled: false
    percent: 90
    seconds: 300
  # Collect a TSF when agent CPU stays at or above `percent` of its CPU limit for `seconds`.
  # Requires tsfPersistentStorage.enabled=true.
  cpuTsfTrigger:
    enabled: false
    percent: 90
    seconds: 300
